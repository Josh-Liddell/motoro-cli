[package]
name = "motoro-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dialoguer = "0.12.0"
dirs = "6.0.0"
reqwest = { version = "0.13.4", features = ["query", "json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
opener = "0.8.4"
anyhow = "1.0.102"
terminal-link = "0.1.0"

[[bin]]
name = "motoro"
path = "src/main.rs"
